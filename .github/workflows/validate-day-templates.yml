name: Validate Day Templates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-templates:
    name: Verify 95 Days Curriculum Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run Day Templates Validation
        run: |
          python3 .github/scripts/validate_day_templates.py
